name: Setup project
description: Install Node dependencies and optionally Rust for Tauri builds.

inputs:
  with-rust:
    description: Whether to install Rust and restore the Cargo cache.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install Rust toolchain
      if: ${{ inputs.with-rust == 'true' }}
      uses: dtolnay/rust-toolchain@stable

    - name: Restore Rust cache
      if: ${{ inputs.with-rust == 'true' }}
      uses: swatinem/rust-cache@v2
      with:
        workspaces: ./src-tauri -> target

    - name: Install frontend dependencies
      shell: pwsh
      run: npm ci
