name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-windows-installer:
    name: Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          with-rust: 'true'

      - name: Read package version
        id: package_version
        shell: pwsh
        working-directory: tauri
        run: Add-Content -Path $env:GITHUB_OUTPUT -Value "value=$(node scripts/version-tools.mjs print)"

      - name: Ensure git tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        run: |
          $expectedTag = "v${{ steps.package_version.outputs.value }}"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            Write-Error "Git tag ${{ github.ref_name }} does not match package.json version $expectedTag."
          }

      - name: Sync Cargo manifest version
        working-directory: tauri
        run: npm run version:sync

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          tagName: v${{ steps.package_version.outputs.value }}
          releaseName: Edge CRX Downloader v${{ steps.package_version.outputs.value }}
          releaseBody: |
            Windows NSIS installer for Edge CRX Downloader.
            Download the attached installer to install this release.
          releaseDraft: false
          prerelease: false

  publish-pyinstaller-bundle:
    name: Publish QFluent Portable Bundle
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: qfluent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        working-directory: qfluent
        run: pyinstaller --onefile --windowed --name EdgeCRXDownloader main.py

      - name: Upload QFluent bundle
        uses: actions/upload-artifact@v4
        with:
          name: edge-crx-downloader-qfluent-windows
          path: qfluent/dist/EdgeCRXDownloader.exe
          if-no-files-found: warn
