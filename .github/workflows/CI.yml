name: CI

on:
  push:
    branches:
      - main
      - master
      - release
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version-and-config-checks:
    name: Version and Config Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run configuration tests
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: version-and-config-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build Nuxt static output
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-static-output
          path: .output/public
          if-no-files-found: error

  tauri-windows-build:
    name: Tauri Windows Verify
    runs-on: windows-latest
    needs: version-and-config-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          with-rust: 'true'

      - name: Build desktop app without installer bundle
        run: npm run tauri:build -- --no-bundle

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: edge-crx-downloader-windows-exe
          path: src-tauri/target/release/edge-crx-downloader.exe
          if-no-files-found: error
