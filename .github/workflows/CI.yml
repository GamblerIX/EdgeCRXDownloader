name: CI

on:
  push:
    branches:
      - main
      - master
      - release
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Tauri (Node / Rust) jobs
  # ===========================================================================

  version-and-config-checks:
    name: "Tauri: Version and Config Checks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run configuration tests
        working-directory: tauri
        run: npm test

  frontend-build:
    name: "Tauri: Frontend Build"
    runs-on: ubuntu-latest
    needs: version-and-config-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build Nuxt static output
        working-directory: tauri
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-static-output
          path: tauri/.output/public
          if-no-files-found: error

  tauri-windows-build:
    name: "Tauri: Windows Verify"
    runs-on: windows-latest
    needs: version-and-config-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          with-rust: 'true'

      - name: Build desktop app without installer bundle
        working-directory: tauri
        run: npm run tauri:build -- --no-bundle

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: edge-crx-downloader-windows-exe
          path: tauri/src-tauri/target/release/edge-crx-downloader.exe
          if-no-files-found: error

  # ===========================================================================
  # QFluent (Python) jobs
  # ===========================================================================

  qfluent-lint-and-test:
    name: "QFluent: Lint and Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: qfluent
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest requests

      - name: Lint with flake8
        working-directory: qfluent
        run: flake8 core/ tests/ main.py main_window.py --max-line-length=120

      - name: Run tests
        working-directory: qfluent
        run: PYTHONPATH=. python -m pytest tests/ -v
